name: "Publish to winget - DEFERRED (disabled)"

# ===========================================================================
# DEFERRED - THIS WORKFLOW IS DISABLED. DO NOT RUN IT.
# ===========================================================================
#
# Wafi X is not published to the Windows Package Manager. The identifier in
# this file is the previous product's package, not ours, and there is no Wafi X
# manifest in the catalog to replace it with. Running this workflow would not
# publish Wafi X: it would either fail on an identifier we do not own, or
# submit a manifest under someone else's package ID pointing at our
# artifacts. Both are worse than doing nothing, so the file is kept intact
# but cannot act.
#
# It is disabled at four independent levels, so no single accidental edit can
# revive it and it is safe to leave in the repository:
#
#   1. The `release:` trigger is gone. Publishing a GitHub release - the event
#      that used to start this - does not reach this workflow.
#   2. There is no `push:`, `schedule:` or `workflow_run:` trigger either, so
#      neither a commit nor a timer can start it.
#   3. Both jobs carry `if: false`, so even a manual dispatch is a no-op and
#      renders as skipped rather than green.
#   4. `WINGET_TOKEN` is unset, and the publish job refuses to run without it
#      in any case.
#
# To re-enable, all of the following must be done together - doing only part
# of it is how the wrong package gets submitted:
#
#   a. Publish a real WinGet manifest for Wafi X in microsoft/winget-pkgs, and
#      take the identifier the catalog actually assigned it. Do NOT invent one.
#      An identifier that resolves to a different package is precisely the
#      failure mode the original comment below warns about.
#   b. Replace `identifier:` in the publish job with that real identifier.
#   c. Delete both `if: false` lines.
#   d. Restore the `release: types: [released]` trigger under `on:`.
#   e. Set the WINGET_TOKEN repository secret.
#
# Nothing here is a compatibility guard for the previous product. It is the
# previous product's submission machinery, retained verbatim so it can be
# switched back on rather than rewritten from memory.
#
# One part of this file IS still useful and is NOT retired by disabling it:
# `scripts/verify-published-release.ps1` verifies a published release's
# installers, hashes and signature independently of any distribution channel.
# RELEASE-VERIFICATION.md documents it, and `stable-download-alias.yml` uses
# the same verification step. Only the catalog submission is deferred.
#
# --- original comment, kept as the historical record of why this existed ----
#
# Every release so far has been submitted to winget by hand: fetch the last
# manifest as a template, edit the version/URL/hash, open a PR. That is how
# a hash mismatch or a stale URL slipped through before - a manual step run
# under time pressure is a manual step that gets skipped or rushed. This
# generates the manifest and opens the PR itself, from the release that is
# already signed and published, so there is nothing left to transcribe.
#
# "released" rather than "published": winget-releaser's own recommendation,
# and it excludes pre-releases specifically - a beta build has no business
# reaching winget's index.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (defaults to latest)"
        required: false

# The job never pushes to this repository - only to a fork of winget-pkgs,
# authenticated by the PAT in WINGET_TOKEN below, which is a separate
# credential from anything GITHUB_TOKEN could grant here.
permissions:
  contents: read

jobs:
  verify:
    # DEFERRED - see the header. Remove this line only as part of the full
    # re-enablement checklist above.
    if: false
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify release installers before catalog submission
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: ./scripts/verify-published-release.ps1 -Tag $env:RELEASE_TAG

  publish:
    # DEFERRED - see the header. Remove this line only as part of the full
    # re-enablement checklist above.
    if: false
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Same shape as the Discord announcement workflow: a missing secret
      # skips the job with a visible warning rather than failing the run
      # red. The PAT is a personal credential tied to a GitHub account, not
      # something that can be generated from inside a workflow.
      - name: Check for the winget PAT
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WINGET_TOKEN secret is not set; skipping the winget submission"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          # DEFERRED - this is the previous product's package identifier, not
          # Wafi X's. It is left verbatim rather than replaced with a guess.
          # See the re-enablement checklist in the header.
          identifier: AurelioAvila.PCTweaker
          # The release also carries an MSI and two stable-named copies of
          # the same binaries for the download link on the site. The default
          # pattern would match all four and produce a manifest listing the
          # same x64 installer twice; every merged manifest so far has listed
          # exactly the versioned NSIS setup, which is what this matches.
          installers-regex: '_x64-setup\.exe$'
          # On a release event `inputs.tag` is empty, and the action then
          # asks GitHub for the release at `/releases/tags/` - a 404 that
          # fails the job before Komac ever runs. The event carries the tag
          # already, so fall back to it and keep the manual input as an
          # override for re-submitting an older release.
          release-tag: ${{ needs.verify.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
