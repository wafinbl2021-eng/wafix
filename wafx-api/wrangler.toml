# Wafi X API - Cloudflare Worker configuration.
#
# No account_id is committed. `wrangler whoami` prints yours; add it under
# [account_id] if you want `wrangler deploy` to stop asking. Everything else
# here works from a bare workers.dev subdomain, which is the point: no custom
# domain, no paid plan, no card.
#
# The desktop app never hardcodes this host. It reads
#   VITE_WAFX_API (build time, with a workers.dev default)
# and the CSP in src-tauri/tauri.conf.json lists whatever host is in use. Move
# to your own domain by changing [vars] and that one CSP entry - nothing else in
# the codebase refers to a hostname.

name = "wafx-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The free *.workers.dev subdomain. This is what decision 5 asks for during
# development: no domain purchase, and swapping to a real domain later is a
# [vars] change plus a DNS record.
workers_dev = true

# ---------------------------------------------------------------------------
# Bindings
# ---------------------------------------------------------------------------

[[d1_databases]]
# Binding name is what the Worker code binds to. The database itself is created
# once, by hand:
#   npx wrangler d1 create wafx
# and the id it prints goes in the line below. This is deliberately not created
# by a script, because the id is the one value here that cannot be known in
# advance.
binding = "DB"
database_name = "wafx"
database_id = "5435c3c1-2155-45fd-b70c-93d6e1657fcb"

# ---------------------------------------------------------------------------
# Static assets
# ---------------------------------------------------------------------------
#
# Workers Static Assets, not R2. The admin panel is a few kilobytes of HTML/JS/CSS
# and this needs no bucket, no binding and no card, so it is the right tier for
# "free as far as possible". R2 stays reserved for installer binaries in a later
# phase, when there is actually a reason to store bytes rather than link to them.
[assets]
directory = "./admin"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

# ---------------------------------------------------------------------------
# Vars
# ---------------------------------------------------------------------------
#
# Non-secret configuration only. Anything sensitive (BOOTSTRAP_TOKEN,
# GITHUB_PAT) belongs in a secret, not here:
#   npx wrangler secret put BOOTSTRAP_TOKEN
#
# The public origin the admin panel is served from. Sent as a header on API
# responses and used to reject requests that claim a different Origin, which is
# the second half of the CSRF defence (SameSite=Strict on the cookie is the
# first). Change this with the domain.
[vars]
PUBLIC_ORIGIN = "https://wafx-api.wafinbl2021.workers.dev"

# How long an admin session cookie stays valid. Rotated on every request; the
# stored expires_at is refreshed to now + this.
SESSION_TTL_HOURS = "12"

# Per-IP login allowance. Ten is generous for one operator and still turns a
# password-guessing script into a multi-day job.
LOGIN_MAX_ATTEMPTS = "10"
LOGIN_WINDOW_MINUTES = "15"

# ---------------------------------------------------------------------------
# Accounts
# ---------------------------------------------------------------------------
#
# These are written out at their defaults rather than left implicit, because they
# are the numbers a reader should be able to check without reading src/env.ts -
# and because a change to a default in code is then a visible diff here too.
#
# They are NOT shared with the admin settings above, and should not be. Admin
# login is one operator; account login is the public internet. One knob for both
# means whichever value is looser governs both.
#
# The origin the Wafi X *app* is served from - the one allowed to make
# cookie-authenticated account changes. This is what decides `Secure` and the
# `__Host-` prefix on the session cookie, so it must be the app's origin and not
# the API's.
#
# Unset means PUBLIC_ORIGIN, which is the right answer whenever the app and the
# API share an origin. Set it the moment they do not:
#   ACCOUNT_ORIGIN = "https://app.wafix.workers.dev"
#
# Extra origins allowed alongside that one, comma-separated, at most 16. A
# malformed entry aborts startup rather than being skipped, because a typo in an
# allowlist should be loud.
# ACCOUNT_ORIGINS = "https://app.wafix.workers.dev,https://wafix.example"

# Account session lifetime, sliding. 24 hours of *use*, not 24 hours from login.
ACCOUNT_SESSION_TTL_HOURS = "24"

# Login guesses allowed per ACCOUNT_WINDOW_MINUTES, counted both per IP and per
# email address. Five, against five above: the same number that is generous for a
# single known operator is a generous budget for an address anyone can name.
ACCOUNT_LOGIN_MAX_ATTEMPTS = "5"
ACCOUNT_WINDOW_MINUTES = "15"

# Registrations allowed per IP per day. A spam ceiling rather than a security
# one, so it is measured over a much longer window.
ACCOUNT_REGISTER_MAX_PER_DAY = "5"

# Sessions one account may hold at once. Past this the least recently used is
# dropped, so a user who signs in and away repeatedly is not locked out by their
# own history.
ACCOUNT_SESSION_MAX_PER_ACCOUNT = "10"

# ---------------------------------------------------------------------------
# R2, when it is actually needed
# ---------------------------------------------------------------------------
#
# Intentionally NOT enabled. Creating an R2 bucket requires adding a payment
# method even on the free tier, and phase 1 uses external https links only.
# The schema already supports r2 (see app_versions.installer_url_kind), so
# turning this on later is uncommenting the block below, adding the binding to
# the Worker, and writing a different value into two existing columns. No
# migration, no change to the desktop app.
#
# [[r2_buckets]]
# binding = "ASSETS_BUCKET"
# bucket_name = "wafx-assets"
# preview_bucket_name = "wafx-assets-preview"

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
# Off by default. Enable when something is actually wrong and you want to read
# the request log; leave off otherwise.
[observability]
enabled = false
